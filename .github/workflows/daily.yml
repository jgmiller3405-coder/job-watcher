name: Daily run

on:
  schedule:
    - cron: "17 11 * * *" # main run
    - cron: "47 18 * * *" # backup: does nothing if today already has a run
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Skip the backup run when today is already done
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          skip=false
          if [ "$SCHEDULE" = "47 18 * * *" ] && [ -f data/status.json ]; then
            done_today=$(jq --arg today "$(date -u +%F)" \
              '(.run_time | startswith($today)) and any(.sources[]; .ok)' data/status.json)
            if [ "$done_today" = "true" ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.4.0
        if: steps.gate.outputs.skip == 'false'

      - name: Fetch, build the history, and write the status
        id: pipeline
        if: steps.gate.outputs.skip == 'false'
        run: uv run --locked --no-dev python -m jobwatcher.run

      - name: Open the daily issue
        if: steps.pipeline.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev python -m jobwatcher.issue

      # Runs even if the issue step failed, so a day's data is never thrown away.
      - name: Commit the data
        id: commit
        if: ${{ !cancelled() && steps.pipeline.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Daily run $(jq -r .run_time data/status.json)"
            git pull --rebase
            git push
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # A push made by a workflow does not start other workflows, so start the tests here.
      - name: Run the tests on the new commit
        if: ${{ !cancelled() && steps.commit.outputs.committed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --ref main

      - name: Fail if every source failed
        if: steps.pipeline.outcome == 'success'
        run: jq -e 'any(.sources[]; .ok)' data/status.json

  site:
    needs: run
    if: ${{ !cancelled() && needs.run.outputs.committed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
